services:
  player:
    build: .
    ports:
      - '${PLAYER_PORT:-8080}:${PLAYER_PORT:-8080}'
    restart: unless-stopped
    environment:
      PLAYER_PASSWORD: ${PLAYER_PASSWORD:?Définissez PLAYER_PASSWORD dans .env}
      PLAYER_HOST: ${PLAYER_HOST:-127.0.0.1}
      PLAYER_PORT: ${PLAYER_PORT:-8080}
      PLAYER_ORIGIN: ${PLAYER_ORIGIN:-}
      PLAYER_AUDIO_BLOCK_MS: ${PLAYER_AUDIO_BLOCK_MS:-20}
      PLAYER_AUDIO_MAX_BACKLOG_MS: ${PLAYER_AUDIO_MAX_BACKLOG_MS:-200}
      PLAYER_CONFIG: /config/player.json
      PLAYER_SETTINGS: /data/settings.json
    volumes:
      - ./config:/config:ro
      - player_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [CMD, python, -m, app.healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  player_data:
